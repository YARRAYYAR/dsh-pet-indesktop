name: Build macOS App

on:
  workflow_dispatch:        # 手动触发（Actions 页面 → Run workflow）
  push:
    tags:
      - 'v*'                # 打 tag 时自动触发并发布 Release

permissions:
  contents: write           # 用于创建 Release 上传产物

jobs:
  build-macos:
    runs-on: macos-latest   # Apple Silicon（arm64）；Intel 用户请用源码运行

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Generate GIF assets from webm
        run: python scripts/convert_to_gif.py

      - name: Run non-GUI regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m compileall -q pet tests
          python -m pytest tests/test_alpha_resampling.py tests/test_media_runtime.py tests/test_runtime.py tests/test_stability.py -q

      - name: Build WebM .app
        run: |
          python -m PyInstaller --noconfirm --clean --windowed \
            --paths . \
            --collect-all imageio_ffmpeg \
            --name "dsh-pet-indesktop-webm" \
            --add-data "assets/characters:assets/characters" \
            --add-data "assets/app-icon.png:assets" \
            packaging/pet_entry.py

      - name: Build GIF .app
        run: |
          python -m PyInstaller --noconfirm --clean --windowed \
            --paths . \
            --collect-all imageio_ffmpeg \
            --name "dsh-pet-indesktop-gif" \
            --add-data "assets/characters_gif:assets/characters_gif" \
            --add-data "assets/app-icon.png:assets" \
            packaging/pet_entry.py

      - name: Verify pet module collected
        run: |
          for APP in dsh-pet-indesktop-webm dsh-pet-indesktop-gif; do
            WARN="build/$APP/warn-$APP.txt"
            if [ -f "$WARN" ] && grep -q "missing module named pet" "$WARN"; then
              echo "::error::$APP pet 模块未被 PyInstaller 收集"; cat "$WARN"; exit 1
            fi
            echo "$APP pet 模块已收集"
          done

      - name: Ad-hoc codesign
        run: |
          for APP in dsh-pet-indesktop-webm dsh-pet-indesktop-gif; do
            test -x "dist/$APP.app/Contents/MacOS/$APP"
            "dist/$APP.app/Contents/MacOS/$APP" --selftest
          done
          codesign --force --deep --sign - "dist/dsh-pet-indesktop-webm.app"
          codesign --force --deep --sign - "dist/dsh-pet-indesktop-gif.app"

      - name: Package as zip
        run: |
          cd dist
          ditto -c -k --keepParent dsh-pet-indesktop-webm.app dsh-pet-indesktop-webm-macos-arm64.zip
          ditto -c -k --keepParent dsh-pet-indesktop-gif.app dsh-pet-indesktop-gif-macos-arm64.zip

      - name: Verify zip preserves executable permission
        run: |
          for ZIP in dsh-pet-indesktop-webm-macos-arm64.zip dsh-pet-indesktop-gif-macos-arm64.zip; do
            APP="${ZIP%-macos-arm64.zip}.app"
            rm -rf /tmp/verify && mkdir -p /tmp/verify
            cd /tmp/verify
            unzip -q "$GITHUB_WORKSPACE/dist/$ZIP"
            BIN_NAME="${APP%.app}"
            BIN="$APP/Contents/MacOS/$BIN_NAME"
            ls -l "$BIN"
            if [ ! -x "$BIN" ]; then
              echo "::error::$ZIP 解压后二进制丢失可执行权限"; exit 1
            fi
            echo "$ZIP 可执行权限保留"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-pet-indesktop-macos-arm64
          path: dist/*.zip
          retention-days: 30

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
